{% extends 'global/base.html' %}

{% block title %} Excluir Setor | {% endblock title %}

{% block content %}
<div class="form-container confirm-delete confirm-delete--compact">
    <h2 class="confirm-delete__title">Tem certeza?</h2>
    
    <p class="confirm-delete__text">
        Você está prestes a excluir o setor: <br>
        <strong>{{ department.name }}</strong>
    </p>

    <div class="confirm-delete__warning">
        ⚠️ Esta ação é irreversível.
    </div>

    <form method="POST">
        {% csrf_token %}
        
        <div class="confirm-delete__actions confirm-delete__actions--rem-gap">
            <a href="{% url 'rhcontrol:department_list' %}" class="confirm-delete__cancel">
                Cancelar
            </a>

            <button type="submit" class="confirm-delete__confirm">
                Confirmar Exclusão
            </button>
        </div>
    </form>
</div>
{% endblock %}
