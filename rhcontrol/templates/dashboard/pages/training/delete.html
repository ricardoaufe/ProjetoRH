{% extends 'global/base.html' %}

{% block title %} Excluir Treinamento | {% endblock title %}

{% block content %}
<div class="form-container confirm-delete">
    <h2 class="confirm-delete__title">Tem certeza?</h2>
    
    <p class="confirm-delete__text">
        Você está prestes a excluir o treinamento: <br>
        <strong>{{ training.name }}</strong>
    </p>

    <div class="confirm-delete__warning">
        ⚠️ Esta ação é irreversível.
    </div>

    <form method="POST">
        {% csrf_token %}
        
        <div class="confirm-delete__actions">
            <a href="{% url 'rhcontrol:training_list' %}" class="confirm-delete__cancel">
                Cancelar
            </a>

            <button type="submit" class="confirm-delete__confirm">
                Confirmar Exclusão
            </button>
        </div>
    </form>
</div>
{% endblock %}
